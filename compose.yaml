# Example deployment. Before starting:
#   cp .env.example .env    # then edit .env (library, collection, git URL, ...)
# and put the two secrets into ./secrets/ (see docs/deployment.md):
#   ./secrets/zotero_api_key        Zotero API key (read-only)
#   ./secrets/sharelatex_git_token  ShareLaTeX git authentication token
services:
  zotero-sharelatex-sync:
    image: ghcr.io/danielgnth/zotero-sharelatex-sync:latest
    restart: unless-stopped
    # Settings live in .env (copy .env.example). Only the secret file paths are set here,
    # because they belong to the secrets mounted below.
    env_file:
      - path: .env
        required: true
    environment:
      ZOTERO_API_KEY_FILE: /run/secrets/zotero_api_key
      SHARELATEX_GIT_TOKEN_FILE: /run/secrets/sharelatex_git_token
    secrets:
      - zotero_api_key
      - sharelatex_git_token
    # Hardening: nothing in the image needs to write outside /tmp or hold any capability.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  zotero_api_key:
    file: ./secrets/zotero_api_key
  sharelatex_git_token:
    file: ./secrets/sharelatex_git_token
